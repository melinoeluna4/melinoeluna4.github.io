# Hooks run only the fast checks from the Commands table, scoped to staged files; tests and the build stay in CI.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,json5,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commits:
      run: |
        message_file="{1}"
        subject=$(head -n 1 "$message_file")
        if ! printf '%s' "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+$'; then
          echo "Commit message must follow Conventional Commits, e.g. feat(blog): add the rss feed" >&2
          echo "Got: $subject" >&2
          exit 1
        fi
